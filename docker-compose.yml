version: "3.9"

services:
  benchmarking-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_benchmarking_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=200
    env_file:
      - .env
    volumes:
      - uploads_tmp:/tmp/streamlit_uploads
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  uploads_tmp:
    driver: local

networks:
  default:
    name: benchmarking_network
