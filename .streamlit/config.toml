[theme]
base                     = "dark"
primaryColor             = "#7c3aed"
backgroundColor          = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor                = "#e2e8f0"
font                     = "sans serif"

[server]
headless             = true
port                 = 8501
enableCORS           = false
enableXsrfProtection = true
maxUploadSize        = 200

[browser]
gatherUsageStats = false

[runner]
magicEnabled = true

[logger]
level = "info"
